name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Install SonarScanner
        shell: pwsh
        run: |
          dotnet tool install dotnet-sonarscanner --tool-path "$env:RUNNER_TEMP/scanner"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/scanner/dotnet-sonarscanner" begin /k:"MorgeanyNicolle_CleanArchitecture" /o:"morgeanynicolle" /d:sonar.token="$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet build Clean.Architecture.slnx --configuration Release --no-incremental
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & "$env:RUNNER_TEMP/scanner/dotnet-sonarscanner" end /d:sonar.token="$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
